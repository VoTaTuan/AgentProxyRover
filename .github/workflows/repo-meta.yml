name: Repo metadata

# Keep the repo description / homepage in sync (single source of truth).
on:
  push:
    branches: [main]
    paths: [.github/workflows/repo-meta.yml]

permissions:
  administration: write

jobs:
  set-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Set description + homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit "${{ github.repository }}" \
            --description "Free HTTP proxies from the internet, filtered down to the best ones and served to your AI agents over MCP + local ports. Sponsored by Shiplo.site" \
            --homepage "https://shiplo.site"
