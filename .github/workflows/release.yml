name: Release

# Build the Windows installer + portable exe and attach them to the GitHub
# release for the pushed tag (vX.Y.Z).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows exe (NSIS setup + portable)
        # --publish never: electron-builder must not try to publish itself
        # (it would demand GH_TOKEN); the release step below attaches the exes
        run: npm run dist -- --publish never

      - name: Attach exes to the release
        uses: softprops/action-gh-release@v2
        with:
          name: AgentProxyRover ${{ github.ref_name }}
          body: |
            Windows builds of AgentProxyRover ${{ github.ref_name }}.

            - **AgentProxy-Setup-*.exe** — installer (per-user, creates a Start Menu shortcut)
            - **AgentProxy-Portable-*.exe** — single portable exe, no install needed

            Run, press **Connect**, and point your agent at the MCP endpoint
            (`claude mcp add --transport http agentproxy http://127.0.0.1:6789/mcp`)
            or use the plain HTTP proxies at `127.0.0.1:8801+`.
          files: |
            dist/*.exe
          draft: false
          prerelease: false
