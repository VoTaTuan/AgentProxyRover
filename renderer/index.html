<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>AgentProxy</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo_white.png" alt="AgentProxy" />
      <span class="dot" id="statusDot"></span>
      <span class="badge" id="planBadge">FREE · 20 proxies</span>
    </div>
    <div class="head-prefs" style="display: flex; gap: 12px; align-items: center;">
      <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 0;">
        <span>🌐</span>
        <select id="languageSelect" style="background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer;">
          <option value="en">EN</option>
          <option value="vi">VN</option>
          <option value="zh">中文</option>
          <option value="ja">日本</option>
          <option value="ko">한국</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
        </select>
      </label>
      <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 0;">
        <span>🎨</span>
        <select id="themeSelect" style="background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer;">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </div>
    <div class="head-actions">
      <button id="btnReload" class="secondary" title="Refresh allocation from backend">⟳ Reload</button>
      <button id="btnToggle" class="primary">Connect</button>
    </div>
  </header>

  <div class="wrapper">
    <!-- LEFT SIDEBAR: Settings & Info -->
    <div class="sidebar">
      <section class="meta" style="flex-direction: row; border: none; padding: 10px 18px; gap: 12px; justify-content: space-between; align-items: center; font-size: 12px;">
        <div style="display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;">
          <span style="color: var(--muted); white-space: nowrap;">IP:</span>
          <code style="background: var(--bg); padding: 2px 6px; border-radius: 3px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer;" title="Click to copy" id="publicIp">–</code>
        </div>
        <div id="quotaLine" class="quota" style="white-space: nowrap; font-size: 11px;"></div>
        <button id="btnResetIp" style="padding: 4px 8px; background: #3fb27f; color: #06130c; border: none; border-radius: 3px; cursor: pointer; font-weight: 600; font-size: 11px; white-space: nowrap;" title="Reset IP allocation">Reset</button>
        <div id="msg" class="msg" style="display: none; position: absolute; bottom: 10px; right: 18px; font-size: 11px;"></div>
      </section>

      <section class="settings">
    <!-- Connection Settings -->
    <div class="settings-section">
      <div class="settings-section-title">🔗 Connection</div>
      <label>Bind IP <input id="bindIp" placeholder="127.0.0.1" /></label>
      <label>Port range
        <span class="row">
          <input id="portStart" type="number" min="1024" max="65535" />
          <span class="muted">→</span>
          <span id="portEnd" class="muted">8801+20</span>
        </span>
      </label>
      <label>Count <input id="portCount" type="number" min="1" max="20" /></label>
      <label>MCP port <input id="mcpPort" type="number" min="1024" max="65535" /></label>
    </div>

    <!-- Proxy Behavior -->
    <div class="settings-section">
      <div class="settings-section-title">⚙️ Proxy Behavior</div>
      <label>Rotation Strategy
        <select id="rotationStrategy">
          <option value="manual">Manual (click to rotate)</option>
          <option value="auto-fail">Auto on failures</option>
          <option value="auto-slow">Auto on slow latency (&gt;500ms)</option>
          <option value="auto-both">Auto on both conditions</option>
        </select>
      </label>
      <label>Health Check Interval
        <select id="healthCheckInterval">
          <option value="perrequest">Per request</option>
          <option value="60000">Every 1 minute</option>
          <option value="300000">Every 5 minutes</option>
          <option value="600000">Every 10 minutes</option>
          <option value="manual">Manual only</option>
        </select>
      </label>
      <label>Quota Alert Threshold
        <select id="quotaAlertThreshold">
          <option value="50">Alert at 50% used</option>
          <option value="70">Alert at 70% used</option>
          <option value="80">Alert at 80% used</option>
          <option value="90">Alert at 90% used</option>
          <option value="100">Never alert</option>
        </select>
      </label>
    </div>

    <!-- Tools & Utilities -->
    <div class="settings-section">
      <div class="settings-section-title">🛠️ Tools</div>
      <button id="btnSave" title="Save all settings">💾 Save Settings</button>
      <button id="btnExportSettings" class="secondary" title="Export all settings to JSON file (backup)">⬇ Export</button>
      <button id="btnImportSettings" class="secondary" title="Import settings from JSON file (restore backup)">⬆ Import</button>
      <input type="file" id="importFile" style="display: none;" accept=".json" />
    </div>
      </section>

      <!-- MCP Section in Sidebar -->
      <section style="padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 600;">
          <span class="dot" id="mcpDot"></span>
          <span>🤖 MCP</span>
          <span id="mcpTools" class="muted" style="font-size: 11px; font-weight: normal;">–</span>
        </div>
        <div style="font-size: 10px; color: var(--muted); margin-bottom: 4px;">Endpoint:</div>
        <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 8px;">
          <code class="mono" id="mcpUrl" style="flex: 1; font-size: 10px; overflow: hidden; text-overflow: ellipsis;">–</code>
          <button class="copy" id="btnCopyMcp" style="padding: 2px 6px; font-size: 10px;" title="Copy MCP endpoint">copy</button>
        </div>
        <div style="font-size: 10px; color: var(--muted); margin-bottom: 4px;">Command:</div>
        <code class="mono" id="mcpCmd" style="display: block; word-break: break-all; font-size: 9px;">–</code>
      </section>
    </div>

    <!-- RIGHT MAIN: Proxy Table & Logs -->
    <main>
    <div class="main-toolbar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="selectAllProxies" title="Select/deselect all proxies" style="cursor: pointer;" />
        <span id="selectedCount" style="color: #8b98a5; font-size: 12px; white-space: nowrap;" title="Number of proxies selected">0</span>
      </div>
      <button id="btnBatchRotate" style="padding: 4px 10px; background: #3fb27f; color: #06130c; border: none; border-radius: 4px; cursor: pointer; display: none; font-weight: 600; font-size: 12px;" title="Rotate selected">⟳</button>
      <button id="btnBatchCopy" style="padding: 4px 10px; background: #3fb27f; color: #06130c; border: none; border-radius: 4px; cursor: pointer; display: none; font-weight: 600; font-size: 12px;" title="Copy selected">📋</button>
      <div style="flex: 1;"></div>
      <select id="reloadMode" style="padding: 4px 8px; background: var(--bg); color: #e6edf3; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font-size: 12px;" title="Reload mode">
        <option value="soft">Soft (Ctrl+R)</option>
        <option value="full">Full (Ctrl+Shift+R)</option>
        <option value="hot">Hot (Ctrl+Alt+R)</option>
      </select>
      <button id="btnReloadApp" style="padding: 4px 10px; background: #3fb27f; color: #06130c; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px;">🔄</button>
      <button id="btnShowLogs" style="padding: 4px 10px; background: #4a5568; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">📋</button>
      <button id="btnClearLogs" style="padding: 4px 10px; background: #c53030; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; font-size: 12px;">🧹</button>
    </div>

    <div class="main-content-area">
    <table id="proxyTable">
      <thead>
        <tr><th style="width: 30px;"><input type="checkbox" id="selectAllHeader" /></th><th>#</th><th>Proxy (local)</th><th>Country</th><th>Exit IP</th><th>Health</th><th>Active</th><th class="num">Req</th><th class="num">↑ / ↓</th><th>OK / Fail</th><th>Actions</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="9" class="empty">Press <b>Connect</b> to fetch your 20 free proxies.</td></tr>
      </tbody>
    </table>

    <div id="logsPanel" style="display: none; margin-top: 12px; border: 1px solid #555; border-radius: 4px; background: #0a0a0a; width: 100%; height: 200px; flex-direction: column;">
      <div id="logsContent" style="background: #0a0a0a; color: #0f0; padding: 12px; height: 100%; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; line-height: 1.5;"></div>
    </div>
    </div>
  </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
