<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>AgentProxy</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo_white.png" alt="AgentProxy" />
      <span class="dot" id="statusDot"></span>
      <span class="badge" id="planBadge">FREE · 20 proxies</span>
    </div>
    <div class="head-actions">
      <button id="btnReload" class="secondary" title="Refresh allocation from backend">⟳ Reload</button>
      <button id="btnToggle" class="primary">Connect</button>
    </div>
  </header>

  <div class="wrapper">
    <!-- LEFT SIDEBAR: Settings & Info -->
    <div class="sidebar">
      <section class="meta" style="flex-direction: column; border: none; padding: 12px 18px; gap: 8px;">
        <div>Your IP: <b id="publicIp">–</b></div>
        <div id="quotaLine" class="quota"></div>
        <div id="msg" class="msg"></div>
      </section>

      <section class="settings">
    <!-- Connection Settings -->
    <div class="settings-section">
      <div class="settings-section-title">🔗 Connection</div>
      <label>Bind IP <input id="bindIp" placeholder="127.0.0.1" /></label>
      <label>Port range
        <span class="row">
          <input id="portStart" type="number" min="1024" max="65535" />
          <span class="muted">→</span>
          <span id="portEnd" class="muted">8801+20</span>
        </span>
      </label>
      <label>Count <input id="portCount" type="number" min="1" max="20" /></label>
      <label>MCP port <input id="mcpPort" type="number" min="1024" max="65535" /></label>
    </div>

    <!-- Proxy Behavior -->
    <div class="settings-section">
      <div class="settings-section-title">⚙️ Proxy Behavior</div>
      <label>Rotation Strategy
        <select id="rotationStrategy">
          <option value="manual">Manual (click to rotate)</option>
          <option value="auto-fail">Auto on failures</option>
          <option value="auto-slow">Auto on slow latency (&gt;500ms)</option>
          <option value="auto-both">Auto on both conditions</option>
        </select>
      </label>
      <label>Health Check Interval
        <select id="healthCheckInterval">
          <option value="perrequest">Per request</option>
          <option value="60000">Every 1 minute</option>
          <option value="300000">Every 5 minutes</option>
          <option value="600000">Every 10 minutes</option>
          <option value="manual">Manual only</option>
        </select>
      </label>
      <label>Quota Alert Threshold
        <select id="quotaAlertThreshold">
          <option value="50">Alert at 50% used</option>
          <option value="70">Alert at 70% used</option>
          <option value="80">Alert at 80% used</option>
          <option value="90">Alert at 90% used</option>
          <option value="100">Never alert</option>
        </select>
      </label>
    </div>

    <!-- App Preferences -->
    <div class="settings-section">
      <div class="settings-section-title">🎨 Preferences</div>
      <label>Language
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="zh">中文 (简体)</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <label>Theme
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </div>

    <!-- Tools & Utilities -->
    <div class="settings-section">
      <div class="settings-section-title">🛠️ Tools</div>
      <button id="btnSave" title="Save all settings">💾 Save Settings</button>
      <button id="btnExportSettings" class="secondary" title="Export all settings to JSON file (backup)">⬇ Export</button>
      <button id="btnImportSettings" class="secondary" title="Import settings from JSON file (restore backup)">⬆ Import</button>
      <input type="file" id="importFile" style="display: none;" accept=".json" />
    </div>
      </section>

      <!-- MCP Section in Sidebar -->
      <section style="padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 600;">
          <span class="dot" id="mcpDot"></span>
          <span>🤖 MCP</span>
          <span id="mcpTools" class="muted" style="font-size: 11px; font-weight: normal;">–</span>
        </div>
        <div style="font-size: 10px; color: var(--muted); margin-bottom: 4px;">Endpoint:</div>
        <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 8px;">
          <code class="mono" id="mcpUrl" style="flex: 1; font-size: 10px; overflow: hidden; text-overflow: ellipsis;">–</code>
          <button class="copy" id="btnCopyMcp" style="padding: 2px 6px; font-size: 10px;" title="Copy MCP endpoint">copy</button>
        </div>
        <div style="font-size: 10px; color: var(--muted); margin-bottom: 4px;">Command:</div>
        <code class="mono" id="mcpCmd" style="display: block; word-break: break-all; font-size: 9px;">–</code>
      </section>
    </div>

    <!-- RIGHT MAIN: Proxy Table & Logs -->
    <main>
    <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
      <label style="display: flex; align-items: center; gap: 6px; color: #8b98a5; font-size: 12px; margin: 0;" title="Reload mode: Soft (UI only, Ctrl+R) | Full (restart, Ctrl+Shift+R) | Hot (dev, Ctrl+Alt+R)">
        Reload:
        <select id="reloadMode" style="padding: 4px 8px; background: #171d24; color: #e6edf3; border: 1px solid #232c36; border-radius: 4px; cursor: pointer; font-size: 12px;">
          <option value="soft" title="Ctrl+R: Reload UI only, proxy keeps running">Soft (UI only)</option>
          <option value="full" title="Ctrl+Shift+R: Full app restart, disconnect & reconnect">Full (Restart app)</option>
          <option value="hot" title="Ctrl+Alt+R: Dev mode - auto reload on changes (requires electron-reload)">Hot Module (Dev)</option>
        </select>
      </label>
      <button id="btnReloadApp" style="padding: 6px 12px; background: #3fb27f; color: #06130c; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px;" title="Click to reload (or use Ctrl+R / Ctrl+Shift+R / Ctrl+Alt+R)">🔄 Reload</button>
      <button id="btnShowLogs" style="padding: 8px 16px; background: #4a5568; color: white; border: none; border-radius: 4px; cursor: pointer;" title="Show/hide console logs">📋 Logs</button>
      <button id="btnClearLogs" style="padding: 8px 16px; background: #c53030; color: white; border: none; border-radius: 4px; cursor: pointer; display: none;" title="Clear all logs">🧹 Clear</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
      <input type="checkbox" id="selectAllProxies" title="Select/deselect all proxies" />
      <span id="selectedCount" style="color: #8b98a5; font-size: 13px;" title="Number of proxies selected for batch operations">0 selected</span>
      <button id="btnBatchRotate" style="padding: 6px 12px; background: #3fb27f; color: #06130c; border: none; border-radius: 4px; cursor: pointer; display: none; font-weight: 600;" title="Rotate all selected proxies (get new IPs, uses 1 reset per proxy)">⟳ Rotate Selected</button>
      <button id="btnBatchCopy" style="padding: 6px 12px; background: #3fb27f; color: #06130c; border: none; border-radius: 4px; cursor: pointer; display: none; font-weight: 600;" title="Copy all selected proxy addresses to clipboard (one per line)">📋 Copy Selected</button>
    </div>
    <table id="proxyTable">
      <thead>
        <tr><th style="width: 30px;"><input type="checkbox" id="selectAllHeader" /></th><th>#</th><th>Proxy (local)</th><th>Country</th><th>Exit IP</th><th>Health</th><th>Active</th><th class="num">Req</th><th class="num">↑ / ↓</th><th>OK / Fail</th><th>Actions</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="9" class="empty">Press <b>Connect</b> to fetch your 20 free proxies.</td></tr>
      </tbody>
    </table>

    <div id="logsPanel" style="display: none; margin-top: 20px; border: 1px solid #555; border-radius: 4px; background: #0a0a0a; width: 100%; height: 60vh; max-height: 800px; flex-direction: column;">
      <div id="logsContent" style="background: #0a0a0a; color: #0f0; padding: 12px; height: 100%; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; line-height: 1.5;"></div>
    </div>
  </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
